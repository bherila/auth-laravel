name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify signed release tag
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Require a verified annotated tag signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')"
          test "${verified}" = "true"

  github-release:
    name: Publish GitHub release notes
    needs: verify-tag
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it as it is."
            exit 0
          fi
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { if (found) exit; found = ($2 == tag); next }
            found { print }
          ' CHANGELOG.md > /tmp/auth-laravel-release-notes.md
          grep -q '[^[:space:]]' /tmp/auth-laravel-release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/auth-laravel-release-notes.md

  packagist:
    name: Update Packagist (bherila/auth-laravel)
    needs: verify-tag
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    environment: prod
    steps:
      - name: Notify Packagist
        run: |
          repository_url="$(
            curl -fsSL 'https://packagist.org/packages/bherila/auth-laravel.json' |
              jq -r '.package.repository'
          )"
          case "${repository_url}" in
            https://github.com/bherila/auth|https://github.com/bherila/auth-laravel)
              ;;
            *)
              echo "Unexpected Packagist repository URL: ${repository_url}"
              exit 1
              ;;
          esac
          payload="$(jq -cn --arg url "${repository_url}" '{repository:{url:$url}}')"
          curl -sf -XPOST -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "${payload}"
        env:
          PACKAGIST_USERNAME: bherila
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
